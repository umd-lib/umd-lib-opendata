{% extends '!layout.html' %}

{%- block sidebarlogo %}
{%- if logo_url %}
  <p class="logo"><a href="https://www.lib.umd.edu/">
    <img class="logo" src="{{ logo_url|e }}" alt="UMD Libraries Logo"/>
  </a></p>
{%- endif %}
{%- endblock %}


{% block footer %}
    <div class="footer">
        <a href="https://giving.umd.edu/giving/showSchool.php?name=libraries">Give Now</a>
        |
        <a href="https://www.lib.umd.edu/about/policies/privacy">Privacy Policy</a>
        |
        <a href="https://www.umd.edu/web-accessibility">Web Accessibility</a>
        |
        &copy; {{ copyright|e }}
    </div>
{% endblock %}

{% block extrahead %}
  <!-- Matomo -->
  <script>
    var _paq = window._paq = window._paq || [];
    /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
    _paq.push(['trackPageView']);
    _paq.push(['enableLinkTracking']);
    (function() {
      var u="https://umd.matomo.cloud/";
      _paq.push(['setTrackerUrl', u+'matomo.php']);
      _paq.push(['setSiteId', '18']);
      var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
      g.async=true; g.src='https://cdn.matomo.cloud/umd.matomo.cloud/matomo.js'; s.parentNode.insertBefore(g,s);
    })();
  </script>
<!-- End Matomo Code -->
{% endblock %}
