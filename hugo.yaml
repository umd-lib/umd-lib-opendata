# Hugo configuration file
title: Open Data

# Canonical site URL; overridden by HUGO_BASEURL in the Docker build and
# auto-replaced with localhost by `hugo server`
baseURL: https://opendata.lib.umd.edu/

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Services
      pageRef: /services
      weight: 2
    - name: APIs
      pageRef: /apis
      weight: 3
    - name: Datasets
      pageRef: /datasets
      weight: 4
    - name: Contact Us
      pageRef: /contact
      weight: 7
    - name: Blog
      pageRef: /posts
      weight: 8
    - name: Search
      weight: 9
      params:
        type: search
    - name: GitHub
      weight: 10
      url: "https://github.com/umd-lib/umd-lib-opendata"
      params:
        icon: github
    - name: Atom Feed
      weight: 11
      pageRef: "/index.xml"
      params:
        icon: rss
    - name: Theme
      weight: 12
      params:
        type: theme-toggle

params:
  theme:
    # Suppresses Hextra's two default homes for the theme control: the footer
    # switches row (which renders above a light divider on this permanently dark
    # footer, and only on pages without a sidebar) and the sidebar copy. The
    # header utility row carries it instead, via the `type: theme-toggle` menu
    # entry above, so there is exactly one control and it is present at every
    # breakpoint.
    displayToggle: false

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/liblogo.svg
      dark: images/liblogo-dark.png
      width: 200
      height: 60

  footer:
    # Both govern Hextra's own copyright block, which is switched off here: it
    # renders a fixed translation string and so cannot carry the current year.
    # The copyright line comes from layouts/partials/custom/footer.html instead
    # and updates itself. Setting either true would render a second, redundant
    # block beneath ours.
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/umd-lib/umd-lib-opendata/blob/main/content"

permalinks:
  page:
    posts: /posts/:year/:month/:slug/
