# Hugo configuration file
title: University of Maryland Libraries Open Data

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Services
      pageRef: /services
      weight: 2
    - name: APIs
      pageRef: /apis
      weight: 3
    - name: Contact Us
      pageRef: /contact
      weight: 7
    - name: About
      pageRef: /about
      weight: 8
    - name: Search
      weight: 9
      params:
        type: search
    - name: GitHub
      weight: 10
      url: "https://github.com/umd-lib/umd-lib-opendata"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/umd-lib/umd-lib-opendata/edit/wallberg/hugo/content"
