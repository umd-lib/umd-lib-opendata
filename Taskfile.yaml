version: '3'

vars:
  VERSION: '2.1.0'
  HUGO_BUILDOPTS: ''

tasks:
    default:
        desc: "Default task"
        cmds:
            - task: build

    build:
        desc: "Build the project"
        vars:
            BUILD_DIR: '{{default "build" .BUILD_DIR}}'
            EXTRA_PARAMS: '{{default "" .EXTRA_PARAMS}}'
        cmds:
            - hugo build -d '{{.BUILD_DIR}}' {{.EXTRA_PARAMS}}

    build:docker:
        desc: "Builds the docs for publishing with pre-configured options (for use within Docker container)"
        cmds:
            - task: build
              vars: {BUILD_DIR: '/target', EXTRA_PARAMS: '--noTimes --noChmod --logLevel info'}

    serve:
        desc: "Serve the site locally with drafts"
        cmds:
            - hugo server --logLevel debug --disableFastRender --port 1314 --buildDrafts --buildFuture

    clean:
        desc: "Clean build artifacts"
        cmds:
            - echo "Cleaning..."
            - rm -rf public/

    deploy:
        desc: "Builds and pushes the umd-lib-opendata image"
        cmds:
            - docker buildx build --platform linux/amd64 --push -t docker.lib.umd.edu/opendata:{{.VERSION}} --build-arg HUGO_BUILDOPTS="{{.HUGO_BUILDOPTS}}" .

    test-python:
        desc: "Test all Python code examples in static/code/"
        cmds:
            - python test_python_examples.py
