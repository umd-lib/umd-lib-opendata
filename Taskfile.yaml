version: '3'

vars:
  WEBHOOK_VERSION: 'latest'
  HUGO_BUILDOPTS: '{{default "" (env "HUGO_BUILDOPTS")}}'

tasks:
    default:
        desc: "Default task"
        cmds:
            - task: build

    build:
        desc: "Build the project"
        vars:
            BUILD_DIR: '{{default "build" .BUILD_DIR}}'
            EXTRA_PARAMS: '{{default "" .EXTRA_PARAMS}}'
            HUGO_BUILDOPTS: '{{default "" .HUGO_BUILDOPTS}}'
        cmds:
            - echo "Building..."
            # --minify to match the Dockerfile, which has always used it. Without
            # it a local build and the deployed artifact differ, so anything the
            # minifier affects would only surface after a deploy. `serve` is left
            # unminified for readable output while working.
            - hugo build --minify -d '{{.BUILD_DIR}}' {{.EXTRA_PARAMS}} {{.HUGO_BUILDOPTS}}

    build:docker:
        desc: "Builds the docs for publishing with pre-configured options (for use within Docker container)"
        cmds:
            - task: build
              vars: {BUILD_DIR: '/target', EXTRA_PARAMS: '--noTimes --noChmod --logLevel info'}

    serve:
        desc: "Serve the site locally with drafts"
        cmds:
            - hugo server --logLevel debug --disableFastRender --port 1314 --buildDrafts --buildFuture

    clean:
        desc: "Clean build artifacts"
        cmds:
            - echo "Cleaning..."
            - rm -rf public/

    deploy:
        desc: "Builds and pushes the opendata-webhook image"
        cmds:
            - docker buildx build --platform linux/amd64 --push -t docker.lib.umd.edu/opendata-webhook:{{.WEBHOOK_VERSION}} ./webhook

    test-python:
        desc: "Test all Python code examples in static/code/"
        cmds:
            - uv run test_python_examples.py
