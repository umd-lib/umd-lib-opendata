server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the nginx version on error pages or in the Server header.
    server_tokens off;

    # Cheap hardening for a static site. No CSP here: the stylesheet is inlined
    # with an SRI hash by head-end.html and a policy would need to account for
    # that plus Matomo, so it belongs in its own change with its own testing.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hugo builds this; without the directive nginx serves its own bare page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Carried over from the stock nginx:1.30 default.conf, which this file
    # replaces. Dropping it silently would be a behaviour change smuggled in
    # under a 404 fix.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
