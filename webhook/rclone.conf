# AWS S3 destination bucket remote
# Uses IAM instance profile or environment variables for authentication
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN)
[s3]
type = s3
provider = AWS
env_auth = true
# ACL for uploaded objects - ensures bucket owner has full control
# Verify this matches your bucket policy and access requirements
acl = bucket-owner-full-control
